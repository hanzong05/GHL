<!-- BlueSpot Guide — Newsletter band (Beaver Builder HTML module, Row = Full Width, no padding). Pairs with footer.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Kaushan+Script&display=swap');

  /* ================= TOKENS / BASE ================= */
  #bsg-nl {
    /* BlueSpot Guide Brand Kit v1.0 — BlueSpot Blue #005baa, Accent Red #e82427 (sparingly),
       Black #000000, Charcoal #2e2e2e, White #ffffff. Fonts: Poppins + Kaushan Script (accents). */
    --blue: #005baa; --blue-d: #004a8c; --red: #e82427; --black: #000000; --charcoal: #2e2e2e; --white: #ffffff;
    --navy: #0b2148; --navy-d: #081a3a; --line: #d6e2f0;
    --muted: #5a5a5a; --ink: var(--charcoal);
    --script: 'Kaushan Script', 'Brush Script MT', cursive;
    font-family: 'Poppins', system-ui, sans-serif; color: var(--navy);
    -webkit-font-smoothing: antialiased; position: relative; overflow-x: clip;
  }
  #bsg-nl *, #bsg-nl *::before, #bsg-nl *::after { box-sizing: border-box; }
  #bsg-nl a { text-decoration: none; color: inherit; }
  #bsg-nl h2, #bsg-nl h3, #bsg-nl p, #bsg-nl ul { margin: 0; padding: 0; }
  #bsg-nl ul { list-style: none; }
  #bsg-nl :focus-visible { outline: 2px solid #6fa3ff; outline-offset: 3px; border-radius: 4px; }
  #bsg-nl .bsg-container { max-width: 1280px; margin: 0 auto; padding: 0 48px; position: relative; z-index: 1; }
  #bsg-nl .bsg-sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ================= NEWSLETTER BAND ================= */
  /* Full-width band. Height + focal point are tuned so the Dalmatian always shows
     from ears down to the BlueSpot charm on its collar, while the band stays compact. */
  #bsg-nl .nl {
    position: relative; overflow: hidden;
    background-color: #dfe9f5;
    background-image: url('https://bluespotguide.com/wp-content/uploads/2026/09/Email-Signup-Row-background.png');
    background-size: cover; background-position: left 48%; background-repeat: no-repeat;
  }
  /* soft wash behind the form so text stays readable over the scenery */
  #bsg-nl .nl::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0) 44%, rgba(255,255,255,.45) 54%, rgba(255,255,255,.45) 88%, rgba(255,255,255,0) 98%);
  }
  #bsg-nl .nl-grid {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 16vw 34vw; align-items: center; gap: 0 3vw;
    min-height: max(300px, 17.5vw); padding: 18px 4vw 18px 30vw;
  }
  #bsg-nl .nl-grid > * { min-width: 0; }
  #bsg-nl .nl-title { margin: 0; line-height: 0; }
  #bsg-nl .nl-title img { display: block; width: 100%; height: auto; }

  #bsg-nl .nl-right { padding: 4px 0; }
  #bsg-nl .nl-lede { font-size: clamp(.95rem, 1vw, 1.2rem); line-height: 1.45; color: var(--ink); font-weight: 500; max-width: 30em; }
  #bsg-nl .nl-form { margin-top: 12px; }
  #bsg-nl .nl-field {
    display: flex; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 4px 4px 14px; box-shadow: 0 6px 22px rgba(18, 36, 77, .12);
    transition: border-color .15s, box-shadow .15s;
  }
  #bsg-nl .nl-field:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,91,170,.2), 0 6px 22px rgba(18,36,77,.12); }
  #bsg-nl .nl-field svg { flex-shrink: 0; width: 20px; height: 20px; color: #7a8bb0; }
  #bsg-nl .nl-input {
    flex: 1; min-width: 0; border: 0 !important; outline: 0; background: transparent !important; box-shadow: none !important;
    font: 500 1rem 'Poppins', system-ui, sans-serif; color: var(--navy); padding: 10px 12px !important; margin: 0; height: auto; font-size: .95rem;
  }
  #bsg-nl .nl-input::placeholder { color: #8394b6; }
  #bsg-nl .nl-btn {
    display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
    background: var(--blue); color: #fff; font: 700 1rem 'Poppins', system-ui, sans-serif;
    padding: 11px 20px; border-radius: 7px; line-height: 1; white-space: nowrap; text-transform: none; letter-spacing: 0;
    transition: background .15s, transform .15s;
  }
  #bsg-nl .nl-btn:hover { background: var(--blue-d); }
  #bsg-nl .nl-btn:active { transform: translateY(1px); }
  #bsg-nl .nl-btn[disabled] { opacity: .7; cursor: default; }
  #bsg-nl .nl-btn svg { width: 18px; height: 18px; }

  #bsg-nl .nl-consent { display: flex; gap: 12px; align-items: flex-start; margin-top: 12px; cursor: pointer; }
  #bsg-nl .nl-check {
    flex-shrink: 0; appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 1px 0 0;
    border: 1.5px solid #8a9bbf; border-radius: 4px; background: #fff; cursor: pointer; position: relative;
  }
  #bsg-nl .nl-check:checked { background: var(--blue); border-color: var(--blue); }
  #bsg-nl .nl-check:checked::after {
    content: ''; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  #bsg-nl .nl-consent-text { font-size: clamp(.72rem, .72vw, .88rem); line-height: 1.5; color: var(--ink); }
  #bsg-nl .nl-legal { margin-top: 10px; font-size: clamp(.74rem, .74vw, .9rem); color: var(--ink); }
  #bsg-nl .nl-legal a { text-decoration: underline; text-underline-offset: 2px; }
  #bsg-nl .nl-legal a:hover { color: var(--blue); }
  #bsg-nl .nl-msg { margin-top: 10px; font-size: .85rem; font-weight: 600; min-height: 1.2em; }
  #bsg-nl .nl-msg.is-err { color: var(--red); }
  #bsg-nl .nl-msg.is-ok { color: #157a4a; }
  #bsg-nl .nl.is-shake .nl-consent { animation: bsgShake .35s; }
  @keyframes bsgShake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }


  /* ================= RESPONSIVE ================= */
  @media (max-width: 1200px) {
    #bsg-nl .nl-grid { grid-template-columns: 17vw minmax(0, 1fr); padding-right: 3vw; }
  }
  /* Tablet & mobile: art band on top (dog + heading), form below */
  @media (max-width: 900px) {
    #bsg-nl .nl { background-size: 100% auto; background-position: left top; background-color: #eef3fa; }
    #bsg-nl .nl::before { display: none; }
    #bsg-nl .nl-grid { grid-template-columns: 1fr; min-height: 0; padding: 0 32px 34px; gap: 0; }
    #bsg-nl .nl-left { margin: 0 -32px; }
    #bsg-nl .nl-left { height: calc(100vw / 3); display: flex; align-items: center; padding-left: 31vw; }
    #bsg-nl .nl-title img { width: 36vw; max-width: none; }
    #bsg-nl .nl-right { padding: 26px 0 0; max-width: none; }
  }
  @media (max-width: 560px) {
    #bsg-nl .nl-grid { padding: 0 20px 30px; }
    #bsg-nl .nl-left { margin: 0 -20px; }
    #bsg-nl .nl-field { flex-wrap: wrap; padding: 6px; }
    #bsg-nl .nl-field svg { margin-left: 10px; }
    #bsg-nl .nl-btn { width: 100%; justify-content: center; margin-top: 4px; padding: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #bsg-nl * { transition: none !important; animation: none !important; }
  }

  /* ===== BRAND FONTS (enforced so the theme can't override them) =====
     Poppins = all text. Kaushan Script = taglines / short branded phrases. */
  #bsg-nl, #bsg-nl *:not(svg):not(path) { font-family: 'Poppins', system-ui, sans-serif !important; }
</style>

<div id="bsg-nl">
  <!-- ================= NEWSLETTER ================= -->
  <section class="nl" aria-labelledby="bsgNlTitle">
    <div class="nl-grid">
      <div class="nl-left">
        <h2 class="nl-title" id="bsgNlTitle">
          <img src="https://bluespotguide.com/wp-content/uploads/2026/09/stay-in-the-know-then-go.png" alt="Stay in the Know. Then Go." width="1634" height="962" loading="lazy">
        </h2>
      </div>

      <div class="nl-right">
        <p class="nl-lede">Campground inspiration, local favorites, travel tips and new destinations—delivered to your inbox.</p>

        <form class="nl-form" id="bsgNlForm" novalidate>
          <div class="nl-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>
            <label class="bsg-sr" for="bsgNlEmail">Email address</label>
            <input class="nl-input" id="bsgNlEmail" name="email" type="email" autocomplete="email" placeholder="Enter your email address" required>
            <button class="nl-btn" type="submit">Subscribe
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>

          <label class="nl-consent">
            <input class="nl-check" id="bsgNlConsent" name="consent" type="checkbox" value="yes" required>
            <span class="nl-consent-text">By checking this box and clicking Subscribe, I agree to receive promotional email communications from BlueSpot, including BlueSpot Guide, about destinations, campgrounds, travel information, products, services and offers that may be of interest to me. I understand I can unsubscribe at any time.</span>
          </label>

          <p class="nl-legal">By subscribing, you acknowledge our <a href="/privacy-policy/">Privacy Policy</a> and <a href="/terms/">Terms of Service</a>.</p>
          <p class="nl-msg" id="bsgNlMsg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';
  /* ---- CONFIG ----
     SUBSCRIBE_URL: paste your GoHighLevel inbound-webhook URL (or any endpoint that accepts JSON POST).
     Leave empty to only show the success message (useful on staging). */
  var SUBSCRIBE_URL = '';
  var SOURCE_TAG = 'bsg-newsletter';

  var root = document.getElementById('bsg-nl');
  if (!root) return;
  var form = document.getElementById('bsgNlForm');
  if (!form) return;
  var email = document.getElementById('bsgNlEmail');
  var consent = document.getElementById('bsgNlConsent');
  var msg = document.getElementById('bsgNlMsg');
  var btn = form.querySelector('.nl-btn');
  var band = root.querySelector('.nl');

  function say(text, ok) {
    msg.textContent = text;
    msg.className = 'nl-msg ' + (ok ? 'is-ok' : 'is-err');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = (email.value || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
      say('Please enter a valid email address.', false); email.focus(); return;
    }
    if (!consent.checked) {
      say('Please check the box to agree to receive emails.', false);
      band.classList.remove('is-shake'); void band.offsetWidth; band.classList.add('is-shake');
      consent.focus(); return;
    }
    var done = function () {
      say('Thanks! You’re subscribed — watch your inbox for travel ideas.', true);
      form.reset(); btn.disabled = false;
    };
    if (!SUBSCRIBE_URL) { done(); return; }
    btn.disabled = true;
    fetch(SUBSCRIBE_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: v, consent: true, consent_text: consent.parentNode.textContent.trim(), source: SOURCE_TAG, page: location.href, submitted_at: new Date().toISOString() })
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status); done();
    }).catch(function () {
      btn.disabled = false; say('Something went wrong. Please try again in a moment.', false);
    });
  });
})();
</script>
